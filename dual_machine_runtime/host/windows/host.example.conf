# CAT6 defaults: host 10.57.23.1 <-> phone 10.57.23.2. The production runtime
# overrides the peer automatically after validated wireless-LAN discovery when
# CAT6 is unavailable; users do not edit an address or select an interface.
# Do not place production secrets in source control.
phone_host = "10.57.23.2"
video_port = 5000

# The production AI stream is the centered 416x416 ROI of the automatically
# selected game display, with the Windows primary display as a safe fallback.
width = 416
height = 416

# H.264 timestamp/keyframe metadata only. This is not a capture scheduler,
# sleep interval, publication-rate target, or FPS ceiling.
frames_per_second = 144
keyframe_interval_frames = 288

adapter_index = 0
output_index = 0
metrics_interval_frames = 144
metrics_csv_path = "visionforge_streamer_metrics.csv"
